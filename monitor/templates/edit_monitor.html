{% extends "base.html" %}

{% block title %}Edit Monitor — Pingger{% endblock %}

{% block extra_css %}
<style>

    .form-page {
        max-width: 520px;
        margin: 0 auto;
    }

    .form-page-header {
        margin-bottom: 28px;
    }

    .form-page-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.4px;
        color: var(--text);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .form-page-title-icon {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        background: linear-gradient(135deg, #f59e0b, #ef4444);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
    }

    .form-page-subtitle {
        font-size: 13.5px;
        color: var(--text-dim);
    }

    .form-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 28px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 180px;
        gap: 14px;
    }

    .form-hint {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 5px;
    }

    .form-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        gap: 12px;
        flex-wrap: wrap;
    }

    .btn-submit {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 24px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: var(--transition);
        box-shadow: 0 0 16px rgba(99, 102, 241, 0.3);
    }

    .btn-submit:hover {
        background: var(--accent-hover);
        box-shadow: 0 0 24px rgba(99, 102, 241, 0.45);
        transform: translateY(-1px);
    }

    .btn-submit:active {
        transform: translateY(0);
    }

    .btn-submit svg {
        width: 16px;
        height: 16px;
    }

    @media (max-width: 480px) {
        .form-row {
            grid-template-columns: 1fr;
        }
    }

</style>
{% endblock %}

{% block content %}

    <div class="form-page">

        <!-- Header -->

        <div class="form-page-header">
            <div class="form-page-title">
                <div class="form-page-title-icon">✏️</div>
                Edit Monitor
            </div>
            <div class="form-page-subtitle">Update the settings for this website monitor.</div>
        </div>


        <!-- Form Card -->

        <div class="form-card">

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label">Website Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-input"
                        value="{{ monitor.name }}"
                        required
                    />
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label class="form-label">Website URL</label>
                        <input
                            type="url"
                            name="url"
                            class="form-input"
                            value="{{ monitor.url }}"
                            required
                        />
                        <div class="form-hint">Full URL including https://</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Check Every</label>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input
                                type="number"
                                name="check_interval"
                                class="form-input"
                                min="1"
                                value="{{ monitor.check_interval }}"
                                required
                                style="flex:1;"
                            />
                            <span style="color:var(--text-dim); font-size:13px; white-space:nowrap;">min</span>
                        </div>
                    </div>

                </div>

                <div class="form-footer">

                    <a href="{% url 'monitor_list' %}" class="btn-secondary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                        Cancel
                    </a>

                    <button type="submit" class="btn-submit">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

{% endblock %}
