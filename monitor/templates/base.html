<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Pingger{% endblock %}</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* NAVBAR */

        .navbar {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            text-decoration: none;
            color: #111;

            font-size: 21px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-link {
            text-decoration: none;
            color: #444;
            font-size: 14px;
        }

        .nav-link:hover {
            color: #000;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 14px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;

            border-radius: 50%;

            background: #e9eef6;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;
        }

        .logout-button {
            border: 1px solid #ddd;

            background: white;

            padding: 7px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;
        }

        .logout-button:hover {
            background: #f3f3f3;
        }

        /* PAGE */

        .page-container {
            max-width: 1200px;

            margin: 0 auto;

            padding: 30px;
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <a
            href="{% url 'monitor_list' %}"
            class="brand"
        >
            🔔 Pingger
        </a>


        {% if user.is_authenticated %}

            <div class="nav-right">

                <a
                    href="{% url 'monitor_list' %}"
                    class="nav-link"
                >
                    Monitors
                </a>


                <div class="user-info">

                    <div class="user-avatar">
                        👤
                    </div>

                    <span>
                        {{ user.email|default:user.username }}
                    </span>

                </div>


                <form
                    method="post"
                    action="{% url 'account_logout' %}"
                    style="margin: 0;"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="logout-button"
                    >
                        Logout
                    </button>

                </form>

            </div>

        {% endif %}

    </nav>


    <!-- PAGE CONTENT -->

    <main class="page-container">

        {% block content %}
        {% endblock %}

    </main>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
