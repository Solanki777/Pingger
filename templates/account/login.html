<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In - Pingger</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7fb;
        }


        .login-container {

            width: 380px;

            padding: 40px;

            background: white;

            border-radius: 14px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);

            text-align: center;
        }


        .logo {

            font-size: 48px;

            margin-bottom: 10px;
        }


        h1 {

            margin: 0;

            font-size: 30px;

            color: #111;
        }


        .subtitle {

            margin-top: 10px;

            margin-bottom: 30px;

            color: #666;

            font-size: 14px;

            line-height: 1.5;
        }


        .google-button {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            width: 100%;

            padding: 13px 18px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: white;

            color: #222;

            font-size: 15px;

            font-weight: 600;

            text-decoration: none;

            transition: 0.2s;
        }


        .google-button:hover {

            background: #f7f7f7;

            border-color: #bbb;
        }


        .google-icon {

            font-size: 20px;
        }


        .footer {

            margin-top: 25px;

            color: #999;

            font-size: 12px;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            🔔
        </div>


        <h1>
            Pingger
        </h1>


        <p class="subtitle">

            Monitor your websites.<br>
            Know when they go down.

        </p>


        <a
            href="/accounts/google/login/?process=login"
            class="google-button"
        >

            <span class="google-icon">
                🌐
            </span>

            Continue with Google

        </a>


        <div class="footer">

            Secure authentication powered by Google

        </div>

    </div>

</body>

</html>
